<div class="page" style="max-width: 440px;">
  <h1>Create account</h1>

  <div class="card">
    @if (errorMessage()) {
      <div class="error-banner">{{ errorMessage() }}</div>
    }

    <form (ngSubmit)="submit()" class="grid">
      <div class="form-row">
        <div class="field" style="flex: 1;">
          <label for="firstName">First name</label>
          <input id="firstName" name="firstName" [(ngModel)]="firstName" required />
        </div>
        <div class="field" style="flex: 1;">
          <label for="lastName">Last name</label>
          <input id="lastName" name="lastName" [(ngModel)]="lastName" required />
        </div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" minlength="8" required />
        <span class="muted">At least 8 characters.</span>
      </div>
      <div class="field">
        <label for="phone">Phone (optional)</label>
        <input id="phone" name="phone" [(ngModel)]="phone" />
      </div>
      <button class="primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Creating…' : 'Create account' }}
      </button>
    </form>

    <p class="muted" style="margin-top: 16px;">
      Already have an account? <a routerLink="/login">Log in</a>
    </p>
  </div>
</div>
