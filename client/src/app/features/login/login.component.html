<div class="page" style="max-width: 400px;">
  <h1>Log in</h1>

  <div class="card">
    @if (errorMessage()) {
      <div class="error-banner">{{ errorMessage() }}</div>
    }

    <form (ngSubmit)="submit()" class="grid">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" [(ngModel)]="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" [(ngModel)]="password" required />
      </div>
      <button class="primary" type="submit" [disabled]="submitting()">
        {{ submitting() ? 'Logging in…' : 'Log in' }}
      </button>
    </form>

    <p class="muted" style="margin-top: 16px;">
      No account? <a routerLink="/register">Register here</a>
    </p>
    <p class="muted">Admin demo login: admin&#64;hotelbooking.local / Admin#12345</p>
  </div>
</div>
